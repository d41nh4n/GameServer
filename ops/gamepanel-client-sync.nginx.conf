server {
    listen 100.82.102.38:5001;
    server_name _;
    server_tokens off;
    client_max_body_size 16k;

    location = /GamePanel.ClientUpdater.exe {
        alias /srv/gamepanel/client-sync/downloads/GamePanel.ClientUpdater.exe;
        default_type application/vnd.microsoft.portable-executable;
        add_header Cache-Control "no-cache" always;
    }

    location = /SHA256SUMS {
        alias /srv/gamepanel/client-sync/downloads/SHA256SUMS;
        default_type text/plain;
        add_header Cache-Control "no-cache" always;
    }

    location = /api/auth/login {
        limit_except POST { deny all; }
        proxy_pass http://100.82.102.38:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
    }

    location = /api/client-updater/manifest {
        auth_request /_client_sync_auth;
        alias /srv/gamepanel/client-sync/current/manifest.json;
        default_type application/json;
        add_header Cache-Control "no-store" always;
    }

    location ~ "^/api/client-updater/packages/([A-Za-z0-9][A-Za-z0-9._-]{0,127})/([0-9A-Za-z][0-9A-Za-z.+_-]{0,63})$" {
        auth_request /_client_sync_auth;
        alias /srv/gamepanel/client-sync/current/packages/$1/$2.zip;
        default_type application/zip;
        add_header Cache-Control "private, max-age=300" always;
    }

    location = /candidate/valheim-full-sync-20260914/api/auth/login {
        limit_except POST { deny all; }
        rewrite ^ /api/auth/login break;
        proxy_pass http://100.82.102.38:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
    }

    location = /candidate/valheim-full-sync-20260914/api/client-updater/manifest {
        auth_request /_client_sync_auth;
        alias /srv/gamepanel/client-sync/candidates/valheim-full-sync-20260914/manifest.json;
        default_type application/json;
        add_header Cache-Control "no-store" always;
    }

    location ~ "^/candidate/valheim-full-sync-20260914/api/client-updater/packages/([A-Za-z0-9][A-Za-z0-9._-]{0,127})/([0-9A-Za-z][0-9A-Za-z.+_-]{0,63})$" {
        auth_request /_client_sync_auth;
        alias /srv/gamepanel/client-sync/candidates/valheim-full-sync-20260914/packages/$1/$2.zip;
        default_type application/zip;
        add_header Cache-Control "private, max-age=300" always;
    }

    location = /_client_sync_auth {
        internal;
        proxy_pass http://100.82.102.38:5000/api/servers;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
    }

    location / {
        return 404;
    }
}
